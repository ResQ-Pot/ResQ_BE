name: 'Build and Deploy to Cloud Run'

on:
  push:
    branches: [ "main" ] # 본인의 기본 브랜치 이름(main 또는 develop)으로 맞추세요.

env:
  PROJECT_ID: 'resqpot-490506' # 우리 프로젝트 ID
  REGION: 'asia-northeast3' # 서울 리전
  GAR_REPO: 'resqpot' # Artifact Registry 창고 이름
  SERVICE: 'resqpot-server' # Cloud Run 서버 이름
  # TODO: 아래 WORKLOAD_IDENTITY_PROVIDER 주소의 마지막 '공급업체_이름'을 본인 것에 맞게 수정하세요!
  WORKLOAD_IDENTITY_PROVIDER: 'projects/1094664442661/locations/global/workloadIdentityPools/resqpot/providers/provider'

jobs:
  deploy:
    runs-on: 'ubuntu-latest'

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      # 1. GCP 인증
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ env.WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: 'resqpot@resqpot-490506.iam.gserviceaccount.com'
          token_format: 'access_token'

      # 2. 자바 세팅
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. 스프링 부트 빌드
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew bootJar # (기존 코드의 복잡한 경로를 기본형으로 수정했습니다)

      # 4. 도커 로그인 및 빌드/푸시
      - name: 'Docker Auth'
        uses: 'docker/login-action@v3'
        with:
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.access_token }}'
          registry: '${{ env.REGION }}-docker.pkg.dev'

      - name: 'Build and Push Container'
        run: |-
          DOCKER_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/api:${{ github.sha }}"
          docker build --tag "${DOCKER_TAG}" .
          docker push "${DOCKER_TAG}"

      # 5. Cloud Run으로 배포 (환경변수 주입 추가)
      - name: 'Deploy to Cloud Run'
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: '${{ env.SERVICE }}'
          region: '${{ env.REGION }}'
          image: '${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/api:${{ github.sha }}'
          # 여기에 3가지 키를 모두 적어줍니다.
          env_vars: |
            SAFETY_API_KEY=${{ secrets.SAFETY_API_KEY }}
            WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }}
            GOOGLE_PLACES_API_KEY=${{ secrets.GOOGLE_PLACES_API_KEY }}
          flags: |
            --port=8080
            --allow-unauthenticated